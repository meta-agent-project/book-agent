<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개념 그림 틀</title>
  <!--
    개념 그림 틀. 복사해서 .book/figures/{NN}/{그림 이름}.html로 저장하고 <svg> 안만 바꾼다.
    스타일 기준: assets/style-ref/의 선 그림(굵기 일정한 검정 외곽선, 흰 배경, 평면 채색)
    색은 흰색(바탕)과 검정 #111111(선 · 글자)만 쓴다
    파랑 #3B8FE0(.accent)은 색이 없으면 주인공이 배경에 묻힐 때만 쓰고, 그 이유를 여기에 적는다
    그림자 · 그라데이션 · 회색 · 다른 색은 쓰지 않는다
    연한 회색 테두리는 capture-figure.mjs가 캡처할 때 붙이므로 여기에 그리지 않는다
    캡처: node .claude/skills/book-manuscript/scripts/capture-figure.mjs <이 파일> book/images/{NN}/{그림 이름}.png
  -->
  <style>
    body { margin: 0; background: #ffffff; }
    #figure { display: block; background: #ffffff; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
    .line { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .shape { fill: #ffffff; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .accent { fill: #3B8FE0; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .text { fill: #111111; font-size: 18px; }
    .title { fill: #111111; font-size: 22px; font-weight: 700; }
    .on-accent { fill: #ffffff; font-size: 22px; font-weight: 700; }
    .caption { fill: #111111; font-size: 17px; }
  </style>
</head>
<body>
  <!-- 폭은 760 고정. 높이만 그림에 맞춘다 -->
  <svg id="figure" width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
    <text class="title" x="380" y="36" text-anchor="middle">세 열과 네 개의 경계선</text>
    <text class="text" x="80" y="78" text-anchor="middle">1</text>
    <text class="text" x="275" y="78" text-anchor="middle">2</text>
    <text class="text" x="485" y="78" text-anchor="middle">3</text>
    <text class="text" x="680" y="78" text-anchor="middle">4 (= -1)</text>
    <path class="line" d="M 275 84 L 275 164 M 485 84 L 485 164"/>
    <rect class="shape" x="80" y="92" width="180" height="64"/>
    <rect class="shape" x="290" y="92" width="180" height="64"/>
    <rect class="shape" x="500" y="92" width="180" height="64"/>
    <text class="text" x="170" y="131" text-anchor="middle">첫째 열</text>
    <text class="text" x="380" y="131" text-anchor="middle">둘째 열</text>
    <text class="text" x="590" y="131" text-anchor="middle">셋째 열</text>
    <rect class="shape" x="80" y="192" width="600" height="60" rx="4"/>
    <text class="title" x="380" y="230" text-anchor="middle">입력 영역: grid-column: 1 / -1</text>
    <path class="line" d="M 80 162 L 80 182 M 680 162 L 680 182"/>
    <text class="caption" x="380" y="282" text-anchor="middle">첫 선부터 마지막 선까지 칸 사이 간격도 함께 차지합니다.</text>
  </svg>
</body>
</html>
