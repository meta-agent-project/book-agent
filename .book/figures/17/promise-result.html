<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개념 그림 틀</title>
  <!--
    개념 그림 틀. 복사해서 .book/figures/{NN}/{그림 이름}.html로 저장하고 <svg> 안만 바꾼다.
    스타일 기준: assets/style-ref/의 선 그림(굵기 일정한 검정 외곽선, 흰 배경, 평면 채색)
    색은 흰색(바탕)과 검정 #111111(선 · 글자)만 쓴다
    파랑 #3B8FE0(.accent)은 색이 없으면 주인공이 배경에 묻힐 때만 쓰고, 그 이유를 여기에 적는다
    그림자 · 그라데이션 · 회색 · 다른 색은 쓰지 않는다
    연한 회색 테두리는 capture-figure.mjs가 캡처할 때 붙이므로 여기에 그리지 않는다
    캡처: node .claude/skills/book-manuscript/scripts/capture-figure.mjs <이 파일> book/images/{NN}/{그림 이름}.png
  -->
  <style>
    body { margin: 0; background: #ffffff; }
    #figure { display: block; background: #ffffff; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
    .line { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .shape { fill: #ffffff; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .accent { fill: #3B8FE0; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .text { fill: #111111; font-size: 18px; }
    .title { fill: #111111; font-size: 22px; font-weight: 700; }
    .on-accent { fill: #ffffff; font-size: 22px; font-weight: 700; }
    .caption { fill: #111111; font-size: 17px; }
  </style>
</head>
<body>
  <!-- 폭은 760 고정. 높이만 그림에 맞춘다 -->
  <svg id="figure" width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
    <text class="title" x="380" y="44" text-anchor="middle">Promise 객체와 성공한 값은 다릅니다</text>
    <rect class="shape" x="40" y="82" width="270" height="150" rx="14"/>
    <text class="title" x="175" y="116" text-anchor="middle">delay(300)</text>
    <path class="line" d="M 40 134 L 310 134"/>
    <text class="text" x="175" y="172" text-anchor="middle">반환값: Promise 객체</text>
    <text class="text" x="175" y="208" text-anchor="middle">대기 중에는 결과가 없습니다</text>
    <path class="line" d="M 330 160 L 430 160"/>
    <path class="line" d="M 416 148 L 432 160 L 416 172"/>
    <text class="text" x="380" y="134" text-anchor="middle">await</text>
    <text class="caption" x="380" y="194" text-anchor="middle">성공 뒤</text>
    <rect class="shape" x="450" y="82" width="270" height="150" rx="14"/>
    <text class="title" x="585" y="116" text-anchor="middle">const message</text>
    <path class="line" d="M 450 134 L 720 134"/>
    <text class="text" x="585" y="178" text-anchor="middle">"기다림 완료"</text>
    <text class="text" x="585" y="210" text-anchor="middle">자료형: string</text>
    <text class="caption" x="380" y="280" text-anchor="middle">message에는 성공한 문자열이 담깁니다</text>
  </svg>
</body>
</html>
