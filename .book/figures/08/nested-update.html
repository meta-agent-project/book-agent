<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개념 그림 틀</title>
  <!--
    개념 그림 틀. 복사해서 .book/figures/{NN}/{그림 이름}.html로 저장하고 <svg> 안만 바꾼다.
    스타일 기준: assets/style-ref/의 선 그림(굵기 일정한 검정 외곽선, 흰 배경, 평면 채색)
    색은 흰색(바탕)과 검정 #111111(선 · 글자)만 쓴다
    파랑 #3B8FE0(.accent)은 색이 없으면 주인공이 배경에 묻힐 때만 쓰고, 그 이유를 여기에 적는다
    그림자 · 그라데이션 · 회색 · 다른 색은 쓰지 않는다
    연한 회색 테두리는 capture-figure.mjs가 캡처할 때 붙이므로 여기에 그리지 않는다
    캡처: node .claude/skills/book-manuscript/scripts/capture-figure.mjs <이 파일> book/images/{NN}/{그림 이름}.png
  -->
  <style>
    body { margin: 0; background: #ffffff; }
    #figure { display: block; background: #ffffff; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
    .line { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .shape { fill: #ffffff; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .accent { fill: #3B8FE0; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .text { fill: #111111; font-size: 18px; }
    .title { fill: #111111; font-size: 22px; font-weight: 700; }
    .on-accent { fill: #ffffff; font-size: 22px; font-weight: 700; }
    .caption { fill: #111111; font-size: 17px; }
  </style>
</head>
<body>
  <!-- 폭은 760 고정. 높이만 그림에 맞춘다 -->
  <svg id="figure" width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
    <text class="title" x="192" y="38" text-anchor="middle">member</text>
    <text class="title" x="568" y="38" text-anchor="middle">updatedMember</text>
    <rect class="shape" x="32" y="58" width="320" height="238" rx="14"/>
    <rect class="shape" x="408" y="58" width="320" height="238" rx="14"/>
    <text class="text" x="55" y="95">name: "김코딩"</text>
    <text class="text" x="431" y="95">name: "김코딩"</text>
    <text class="title" x="55" y="133">address</text>
    <text class="title" x="431" y="133">address</text>
    <rect class="shape" x="55" y="150" width="274" height="120" rx="10"/>
    <rect class="shape" x="431" y="150" width="274" height="120" rx="10"/>
    <text class="text" x="74" y="194">city: "서울"</text>
    <text class="text" x="74" y="237">zipCode: "04524"</text>
    <text class="text" x="450" y="194">city: "부산"</text>
    <text class="text" x="450" y="237">zipCode: "04524"</text>
    <path class="line" d="M 362 175 L 396 175 M 387 165 L 397 175 L 387 185"/>
    <text class="caption" x="192" y="325" text-anchor="middle">원본 회원과 주소는 그대로</text>
    <text class="caption" x="568" y="325" text-anchor="middle">회원과 주소 모두 새 객체</text>
  </svg>
</body>
</html>
