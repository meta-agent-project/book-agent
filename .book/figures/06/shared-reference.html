<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개념 그림 틀</title>
  <!--
    개념 그림 틀. 복사해서 .book/figures/{NN}/{그림 이름}.html로 저장하고 <svg> 안만 바꾼다.
    스타일 기준: assets/style-ref/의 선 그림(굵기 일정한 검정 외곽선, 흰 배경, 평면 채색)
    색은 흰색(바탕)과 검정 #111111(선 · 글자)만 쓴다
    파랑 #3B8FE0(.accent)은 색이 없으면 주인공이 배경에 묻힐 때만 쓰고, 그 이유를 여기에 적는다
    그림자 · 그라데이션 · 회색 · 다른 색은 쓰지 않는다
    연한 회색 테두리는 capture-figure.mjs가 캡처할 때 붙이므로 여기에 그리지 않는다
    캡처: node .claude/skills/book-manuscript/scripts/capture-figure.mjs <이 파일> book/images/{NN}/{그림 이름}.png
  -->
  <style>
    body { margin: 0; background: #ffffff; }
    #figure { display: block; background: #ffffff; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
    .line { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .shape { fill: #ffffff; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .accent { fill: #3B8FE0; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .text { fill: #111111; font-size: 18px; }
    .title { fill: #111111; font-size: 22px; font-weight: 700; }
    .on-accent { fill: #ffffff; font-size: 22px; font-weight: 700; }
    .caption { fill: #111111; font-size: 17px; }
  </style>
</head>
<body>
  <!-- 폭은 760 고정. 높이만 그림에 맞춘다 -->
  <svg id="figure" width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
    <text class="title" x="380" y="38" text-anchor="middle">member와 copiedMember가 같은 객체를 가리킵니다</text>
    <rect class="shape" x="36" y="66" width="250" height="64" rx="12"/>
    <circle class="shape" cx="52" cy="82" r="4"/>
    <circle class="shape" cx="270" cy="114" r="4"/>
    <text class="title" x="161" y="105" text-anchor="middle">const member</text>
    <rect class="shape" x="36" y="166" width="250" height="64" rx="12"/>
    <circle class="shape" cx="52" cy="182" r="4"/>
    <circle class="shape" cx="270" cy="214" r="4"/>
    <text class="title" x="161" y="205" text-anchor="middle">const copiedMember</text>
    <path class="line" d="M 300 98 L 365 98 L 365 124 L 436 124"/>
    <path class="line" d="M 422 112 L 436 124 L 422 136"/>
    <path class="line" d="M 300 198 L 365 198 L 365 178 L 436 178"/>
    <path class="line" d="M 422 166 L 436 178 L 422 190"/>
    <rect class="shape" x="452" y="68" width="268" height="164" rx="14"/>
    <path class="line" d="M 452 112 L 720 112"/>
    <text class="title" x="586" y="98" text-anchor="middle">객체 상자 하나</text>
    <text class="text" x="474" y="152">name : "김코딩"</text>
    <text class="text" x="474" y="197">grade : "실버" → "골드"</text>
    <text class="caption" x="380" y="273" text-anchor="middle">같은 상자의 grade를 읽으므로 두 이름으로 모두 "골드"가 보입니다</text>
  </svg>
</body>
</html>
