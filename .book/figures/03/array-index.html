<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>번호가 붙은 칸에 담긴 cart 배열</title>
  <!--
    개념 그림 틀. 복사해서 .book/figures/{NN}/{그림 이름}.html로 저장하고 <svg> 안만 바꾼다.
    스타일 기준: assets/style-ref/의 선 그림(굵기 일정한 검정 외곽선, 흰 배경, 평면 채색)
    색은 흰색(바탕)과 검정 #111111(선 · 글자)만 쓴다
    파랑 #3B8FE0(.accent)은 색이 없으면 주인공이 배경에 묻힐 때만 쓰고, 그 이유를 여기에 적는다
    그림자 · 그라데이션 · 회색 · 다른 색은 쓰지 않는다
    캡처: node .claude/skills/book-manuscript/scripts/capture-figure.mjs <이 파일> book/images/{NN}/{그림 이름}.png
  -->
  <style>
    body { margin: 0; background: #ffffff; }
    #figure { display: block; background: #ffffff; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
    .line { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .shape { fill: #ffffff; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .accent { fill: #3B8FE0; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .text { fill: #111111; font-size: 18px; }
    .title { fill: #111111; font-size: 22px; font-weight: 700; }
    .on-accent { fill: #ffffff; font-size: 22px; font-weight: 700; }
    .caption { fill: #111111; font-size: 17px; }
  </style>
</head>
<body>
  <!-- 폭은 760 고정. 높이만 그림에 맞춘다 -->
  <svg id="figure" width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
    <!-- 3장 3-1: 번호가 붙은 칸에 담긴 cart 배열 -->
    <text class="title" x="380" y="40" text-anchor="middle">const cart</text>
    <path class="line" d="M 80 78 L 80 62 L 680 62 L 680 78"/>
    <path class="line" d="M 380 52 L 380 62"/>

    <text class="text" x="180" y="112" text-anchor="middle">cart[0]</text>
    <text class="text" x="380" y="112" text-anchor="middle">cart[1]</text>
    <text class="text" x="580" y="112" text-anchor="middle">cart[2]</text>

    <rect class="shape" x="86" y="126" width="188" height="88" rx="12"/>
    <rect class="shape" x="286" y="126" width="188" height="88" rx="12"/>
    <rect class="shape" x="486" y="126" width="188" height="88" rx="12"/>
    <text class="text" x="180" y="176" text-anchor="middle">"무선 마우스"</text>
    <text class="text" x="380" y="176" text-anchor="middle">"기계식 키보드"</text>
    <text class="text" x="580" y="176" text-anchor="middle">"모니터"</text>

    <text class="caption" x="180" y="252" text-anchor="middle">인덱스는 0부터 시작한다</text>
    <text class="caption" x="580" y="252" text-anchor="middle">마지막 칸의 인덱스는 2</text>
    <text class="caption" x="380" y="294" text-anchor="middle">칸 수 cart.length는 3</text>
  </svg>
</body>
</html>
