<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>인수, 매개변수, 반환값</title>
  <!--
    개념 그림 틀. 복사해서 .book/figures/{NN}/{그림 이름}.html로 저장하고 <svg> 안만 바꾼다.
    스타일 기준: assets/style-ref/의 선 그림(굵기 일정한 검정 외곽선, 흰 배경, 평면 채색)
    색은 흰색(바탕)과 검정 #111111(선 · 글자)만 쓴다
    파랑 #3B8FE0(.accent)은 색이 없으면 주인공이 배경에 묻힐 때만 쓰고, 그 이유를 여기에 적는다
    그림자 · 그라데이션 · 회색 · 다른 색은 쓰지 않는다
    캡처: node .claude/skills/book-manuscript/scripts/capture-figure.mjs <이 파일> book/images/{NN}/{그림 이름}.png
  -->
  <style>
    body { margin: 0; background: #ffffff; }
    #figure { display: block; background: #ffffff; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
    .line { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .shape { fill: #ffffff; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .accent { fill: #3B8FE0; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .text { fill: #111111; font-size: 18px; }
    .title { fill: #111111; font-size: 22px; font-weight: 700; }
    .on-accent { fill: #ffffff; font-size: 22px; font-weight: 700; }
    .caption { fill: #111111; font-size: 17px; }
  </style>
</head>
<body>
  <!-- 폭은 760 고정. 높이만 그림에 맞춘다 -->
  <svg id="figure" width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
    <!-- 5장 5-2: 인수는 매개변수에 담기고, return 값은 호출한 자리로 돌아간다 (가로 배치) -->
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
      </marker>
    </defs>

    <!-- 머리 글자 -->
    <text class="title" x="100" y="40" text-anchor="middle">인수</text>
    <text class="title" x="385" y="40" text-anchor="middle">function getSubtotal</text>
    <text class="title" x="665" y="40" text-anchor="middle">반환값</text>

    <!-- 인수 -->
    <rect class="shape" x="40" y="66" width="120" height="50" rx="10"/>
    <rect class="shape" x="40" y="136" width="120" height="50" rx="10"/>
    <text class="text" x="100" y="97" text-anchor="middle">12000</text>
    <text class="text" x="100" y="167" text-anchor="middle">1</text>

    <!-- 함수 상자와 매개변수 -->
    <rect class="shape" x="225" y="56" width="320" height="200" rx="14"/>
    <rect class="shape" x="240" y="66" width="180" height="50" rx="10"/>
    <rect class="shape" x="240" y="136" width="180" height="50" rx="10"/>
    <text class="text" x="330" y="97" text-anchor="middle">price = 12000</text>
    <text class="text" x="330" y="167" text-anchor="middle">quantity = 1</text>
    <text class="text" x="483" y="133" text-anchor="middle">매개변수</text>
    <text class="title" x="385" y="228" text-anchor="middle">return price * quantity</text>

    <!-- 인수가 매개변수로 들어가는 화살표 -->
    <path class="line" d="M 166 91 L 232 91" marker-end="url(#arrow)"/>
    <path class="line" d="M 166 161 L 232 161" marker-end="url(#arrow)"/>

    <!-- 반환값 -->
    <path class="line" d="M 551 156 L 588 156" marker-end="url(#arrow)"/>
    <rect class="shape" x="595" y="131" width="140" height="50" rx="10"/>
    <text class="text" x="665" y="162" text-anchor="middle">12000</text>
    <text class="caption" x="665" y="208" text-anchor="middle">mouseTotal에 할당</text>

    <text class="caption" x="380" y="284" text-anchor="middle">인수는 매개변수에 담기고, return 값은 호출한 자리로 돌아간다</text>
  </svg>
</body>
</html>
