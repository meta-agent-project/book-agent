<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개념 그림 틀</title>
  <!--
    개념 그림 틀. 복사해서 .book/figures/{NN}/{그림 이름}.html로 저장하고 <svg> 안만 바꾼다.
    스타일 기준: assets/style-ref/의 선 그림(굵기 일정한 검정 외곽선, 흰 배경, 평면 채색)
    색은 흰색(바탕)과 검정 #111111(선 · 글자)만 쓴다
    파랑 #3B8FE0(.accent)은 색이 없으면 주인공이 배경에 묻힐 때만 쓰고, 그 이유를 여기에 적는다
    그림자 · 그라데이션 · 회색 · 다른 색은 쓰지 않는다
    연한 회색 테두리는 capture-figure.mjs가 캡처할 때 붙이므로 여기에 그리지 않는다
    캡처: node .claude/skills/book-manuscript/scripts/capture-figure.mjs <이 파일> book/images/{NN}/{그림 이름}.png
  -->
  <style>
    body { margin: 0; background: #ffffff; }
    #figure { display: block; background: #ffffff; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
    .line { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .shape { fill: #ffffff; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .accent { fill: #3B8FE0; stroke: #111111; stroke-width: 3; stroke-linejoin: round; }
    .text { fill: #111111; font-size: 18px; }
    .title { fill: #111111; font-size: 22px; font-weight: 700; }
    .on-accent { fill: #ffffff; font-size: 22px; font-weight: 700; }
    .caption { fill: #111111; font-size: 17px; }
  </style>
</head>
<body>
  <!-- 폭은 760 고정. 높이만 그림에 맞춘다 -->
  <svg id="figure" width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
    <rect class="shape" x="32" y="30" width="318" height="252" rx="14"/>
    <text class="title" x="58" y="66">입력 폼</text>
    <path class="line" d="M 32 86 H 350"/>
    <text class="text" x="58" y="122">titleInput</text>
    <rect class="shape" x="58" y="135" width="264" height="40" rx="8"/>
    <text class="text" x="58" y="210">contentInput</text>
    <rect class="shape" x="58" y="223" width="264" height="40" rx="8"/>
    <rect class="shape" x="410" y="30" width="318" height="252" rx="14"/>
    <text class="title" x="436" y="66">목록 noteList</text>
    <path class="line" d="M 410 86 H 728"/>
    <rect class="shape" x="436" y="105" width="266" height="68" rx="8"/>
    <text class="text" x="458" y="146">메모 카드 1</text>
    <rect class="shape" x="436" y="194" width="266" height="68" rx="8"/>
    <text class="text" x="458" y="235">메모 카드 2</text>
    <text class="caption" x="191" y="316" text-anchor="middle">입력칸은 그 자리에 유지</text>
    <text class="caption" x="569" y="316" text-anchor="middle">render()가 안의 카드만 교체</text>
  </svg>
</body>
</html>
