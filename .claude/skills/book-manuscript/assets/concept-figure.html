<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>개념 그림 빈 틀</title>
<style>
body{margin:0;background:#fff}
#figure{display:block;background:#fff;font-family:Pretendard,"Malgun Gothic",sans-serif}
.line{fill:none;stroke:#111;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.shape{fill:#fff;stroke:#111;stroke-width:1.5}
.text,.caption{fill:#111;font-size:16px}
.title{fill:#111;font-size:18px;font-weight:600}
.accent{fill:#3B8FE0;stroke:#111;stroke-width:1.5}
</style>
<!-- 빈 SVG: 필요한 관계와 라벨만 직접 구성한다. 설명 문장은 원고 본문에 쓴다.
기본 560×220, 최대 높이 280. 테두리는 capture-figure.mjs가 붙인다.
색이 학습 내용의 구분에 필요할 때만 accent를 쓰고 이유를 주석에 기록한다. -->
<svg id="figure" width="560" height="220" viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg"></svg>
</html>
